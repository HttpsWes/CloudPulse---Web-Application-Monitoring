<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CloudPulse AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main>
      <p class="eyebrow">CloudPulse AI · Day 1</p>
      <h1>Application monitor</h1>
      <p>This local app generates health, status, and error events for future monitoring.</p>
      <section class="card" aria-live="polite">
        <h2>Current application status</h2>
        <p id="status">Checking…</p>
        <button id="refresh" type="button">Refresh status</button>
      </section>
      <p class="links"><a href="/api/health">Health JSON</a> · <a href="/api/status">Status JSON</a></p>
    </main>
    <script>
      async function refreshStatus() {
        const label = document.getElementById('status');
        label.textContent = 'Checking…';
        try {
          const response = await fetch('/api/status');
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          label.textContent = `${data.status} · uptime ${data.uptime_seconds}s`;
        } catch {
          label.textContent = 'Unavailable';
        }
      }
      document.getElementById('refresh').addEventListener('click', refreshStatus);
      refreshStatus();
    </script>
  </body>
</html>
